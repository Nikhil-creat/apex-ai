name: apex-ai
networks: { apex: { driver: bridge } }
volumes: { qdrant: {}, neo4j: {} }
x-hc: &hc { interval: 15s, timeout: 5s, retries: 5, start_period: 20s }
services:
  apex-gateway:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: { apex-agent: { condition: service_healthy }, apex-ui: { condition: service_started } }
    networks: [apex]
  apex-agent:
    build: ./agent
    env_file: .env
    environment:
      QDRANT_URL: http://apex-vectordb:6333
      NEO4J_URI: bolt://apex-graphdb:7687
      NEO4J_USER: neo4j
      VISION_URL: http://apex-vision:8001
    depends_on: { apex-vectordb: { condition: service_healthy }, apex-graphdb: { condition: service_healthy }, apex-vision: { condition: service_healthy } }
    healthcheck: { <<: *hc, test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8000/health')"] }
    networks: [apex]
  apex-vision:
    build: ./vision
    healthcheck: { <<: *hc, test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8001/health')"] }
    networks: [apex]
  apex-vectordb:
    image: qdrant/qdrant:v1.12.0
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck: { <<: *hc, test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"] }
    networks: [apex]
  apex-graphdb:
    image: neo4j:5
    environment: { NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}" }
    volumes: ["neo4j:/data"]
    healthcheck: { <<: *hc, test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1'"] }
    networks: [apex]
  apex-ui:
    build: ./ui
    environment: { NEXT_PUBLIC_API: /api }
    networks: [apex]
