limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
server {
  listen 80;
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://apex-agent:8000/;
    proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_buffering off; proxy_read_timeout 300s;   # keeps SSE streaming
  }
  location / { proxy_pass http://apex-ui:3000; proxy_set_header Host $host; }
}
